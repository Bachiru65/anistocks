name: Temporary archive identifier lookup

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Search Internet Archive metadata
        shell: bash
        run: |
          mkdir -p lookup
          python - <<'PY'
          import json,urllib.parse,urllib.request,pathlib
          queries=[
            'title:"From Dawn to Sunset (Part I)"',
            'title:"From Dawn to Sunset (Part II)"',
            'title:"From Dawn to Sunset" AND year:1937',
            'identifier:FromDawn*'
          ]
          all_results=[]
          for q in queries:
              params=urllib.parse.urlencode([('q',q),('fl[]','identifier'),('fl[]','title'),('fl[]','date'),('fl[]','mediatype'),('rows','100'),('page','1'),('output','json')])
              url='https://archive.org/advancedsearch.php?'+params
              with urllib.request.urlopen(url,timeout=60) as r: d=json.load(r)
              docs=d.get('response',{}).get('docs',[])
              all_results.append({'query':q,'url':url,'docs':docs})
          pathlib.Path('lookup/results.json').write_text(json.dumps(all_results,indent=2))
          PY
      - name: Upload lookup
        uses: actions/upload-artifact@v4
        with:
          name: archive-lookup
          path: lookup
          retention-days: 1
