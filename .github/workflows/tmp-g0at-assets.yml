name: Temporary g0at edit visual fetch

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: read

jobs:
  fetch-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and requests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install requests
      - name: Resolve and fetch public-domain labor footage
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p visual-assets/contact visual-assets/logs
          python - <<'PY' > visual-assets/logs/fetch.log 2>&1
          import json,pathlib,requests,urllib.parse
          out=pathlib.Path('visual-assets')
          for ident in ['FromDawn1937_1','FromDawn1937_2']:
              d=requests.get(f'https://archive.org/metadata/{ident}',timeout=60).json()
              rows=[]
              for f in d.get('files',[]):
                  n=f.get('name','')
                  try:s=int(f.get('size') or 0)
                  except:s=0
                  if n.lower().endswith(('.mp4','.m4v','.ogv','.mpeg','.mpg')):
                      rows.append({'name':n,'size':s,'format':f.get('format'),'source':f.get('source')})
              (out/f'{ident}_files.json').write_text(json.dumps(sorted(rows,key=lambda x:x['size']),indent=2))
              candidates=[x for x in rows if x['name'].lower().endswith('.mp4') and x['size']>2_000_000]
              candidates.sort(key=lambda x:(0 if '512' in x['name'].lower() else 1,x['size']))
              if not candidates: raise RuntimeError(f'no mp4 candidate for {ident}: {rows}')
              chosen=candidates[0]
              u=f'https://archive.org/download/{ident}/{urllib.parse.quote(chosen["name"])}'
              print('FETCH',ident,chosen,u)
              with requests.get(u,stream=True,timeout=240) as r:
                  r.raise_for_status()
                  with (out/f'{ident}.mp4').open('wb') as h:
                      for c in r.iter_content(1024*1024):
                          if c:h.write(c)
          d=requests.get('https://archive.org/metadata/masterhandscomplete4kh264',timeout=60).json()
          rows=[]
          for f in d.get('files',[]):
              n=f.get('name','')
              if n.lower().endswith(('.mp4','.m4v','.ogv','.mpeg','.mpg')):
                  rows.append({'name':n,'size':int(f.get('size') or 0),'format':f.get('format'),'source':f.get('source')})
          (out/'master_hands_files.json').write_text(json.dumps(sorted(rows,key=lambda x:x['size']),indent=2))
          PY
          for src in visual-assets/FromDawn1937_*.mp4; do
            [ -s "$src" ] || continue
            b=$(basename "$src" .mp4)
            ffprobe -v error -show_entries format=duration,size -of json "$src" > "visual-assets/${b}_probe.json"
            ffmpeg -y -i "$src" -vf 'fps=1/10,scale=300:-2,tile=6x6' -frames:v 1 "visual-assets/contact/${b}_contact.jpg" >/dev/null 2>&1 || true
          done
          find visual-assets -type f -printf '%P\t%s bytes\n' | sort > visual-assets/FILELIST.txt
      - name: Upload visual bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0at-visual-assets
          path: visual-assets
          compression-level: 0
          retention-days: 1
