name: Temporary confirmed archive fetch

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch confirmed archive derivatives
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p visual-assets
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://archive.org/download/FromDawn1937/FromDawn1937_512kb.mp4' \
            -o visual-assets/from_dawn_part1.mp4
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://archive.org/download/FromDawn1937_2/FromDawn1937_2_512kb.mp4' \
            -o visual-assets/from_dawn_part2.mp4 || true
          find visual-assets -type f -printf '%P\t%s bytes\n' | sort > visual-assets/FILELIST.txt
      - name: Upload footage
        uses: actions/upload-artifact@v4
        with:
          name: confirmed-factory-footage
          path: visual-assets
          compression-level: 0
          retention-days: 1
