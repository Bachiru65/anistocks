name: Temporary g0at edit visual fetch

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: read

jobs:
  fetch-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Fetch public-domain labor footage
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p visual-assets/contact
          curl -L --fail --retry 3 'https://archive.org/download/FromDawn1937_1/FromDawn1937_1_512kb.mp4' -o visual-assets/from_dawn_part1.mp4
          curl -L --fail --retry 3 'https://archive.org/download/FromDawn1937_2/FromDawn1937_2_512kb.mp4' -o visual-assets/from_dawn_part2.mp4
          for src in visual-assets/*.mp4; do
            b=$(basename "$src" .mp4)
            ffprobe -v error -show_entries format=duration,size -of json "$src" > "visual-assets/${b}_probe.json"
            ffmpeg -y -i "$src" -vf 'fps=1/10,scale=300:-2,tile=6x6' -frames:v 1 "visual-assets/contact/${b}_contact.jpg"
          done
          python - <<'PY'
          import json,requests,pathlib
          d=requests.get('https://archive.org/metadata/masterhandscomplete4kh264',timeout=60).json()
          rows=[]
          for f in d.get('files',[]):
              n=f.get('name','')
              if n.lower().endswith(('.mp4','.m4v','.ogv','.mpeg','.mpg')):
                  rows.append({'name':n,'size':int(f.get('size') or 0),'format':f.get('format'),'source':f.get('source')})
          pathlib.Path('visual-assets/master_hands_files.json').write_text(json.dumps(sorted(rows,key=lambda x:x['size']),indent=2))
          PY
          find visual-assets -type f -printf '%P\t%s bytes\n' | sort > visual-assets/FILELIST.txt
      - name: Upload visual bundle
        uses: actions/upload-artifact@v4
        with:
          name: g0at-visual-assets
          path: visual-assets
          compression-level: 0
          retention-days: 1
