name: Temporary g0at edit asset fetch

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install fetch tools
        run: python -m pip install --upgrade yt-dlp requests
      - name: Fetch exact song and archival material
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p edit-assets/loc
          URL='https://www.youtube.com/watch?v=6OiljO_Cj0A'
          if ! yt-dlp --js-runtimes node --remote-components ejs:github --no-playlist \
            -f 'bestaudio[ext=m4a]/bestaudio' -o 'edit-assets/song_source.%(ext)s' "$URL"; then
            python - <<'PY'
          import json, pathlib, requests, sys
          video_id = '6OiljO_Cj0A'
          bases = ['https://pipedapi.adminforge.de','https://pipedapi.private.coffee','https://pipedapi.reallyaweso.me','https://pipedapi.kavin.rocks']
          out = pathlib.Path('edit-assets/song_source.m4a')
          errors=[]
          for base in bases:
              try:
                  d=requests.get(f'{base}/streams/{video_id}',timeout=45).json()
                  ss=sorted([s for s in d.get('audioStreams',[]) if s.get('url')],key=lambda s:int(s.get('bitrate') or 0),reverse=True)
                  if not ss: raise RuntimeError('no streams')
                  with requests.get(ss[0]['url'],stream=True,timeout=180) as r:
                      r.raise_for_status()
                      with out.open('wb') as f:
                          for c in r.iter_content(1024*1024):
                              if c:f.write(c)
                  if out.stat().st_size < 500000: raise RuntimeError('small response')
                  pathlib.Path('edit-assets/piped_metadata.json').write_text(json.dumps(d,ensure_ascii=False,indent=2))
                  sys.exit(0)
              except Exception as e:
                  errors.append(f'{base}: {e}')
                  if out.exists():out.unlink()
          raise SystemExit('\n'.join(errors))
          PY
          fi
          SRC=$(find edit-assets -maxdepth 1 -name 'song_source.*' -type f | head -n1)
          ffmpeg -y -i "$SRC" -vn -ac 2 -ar 48000 -c:a pcm_s16le edit-assets/song_full.wav
          ffprobe -v error -show_entries format=duration -of json edit-assets/song_full.wav > edit-assets/song_probe.json
          curl -L --fail --retry 3 'https://archive.org/download/FromDawn1937_3/FromDawn1937_3_512kb.mp4' -o edit-assets/from_dawn_part3.mp4
          python - <<'PY'
          import json,pathlib,requests
          ident='masterhandscomplete4kh264'
          d=requests.get(f'https://archive.org/metadata/{ident}',timeout=60).json()
          c=[]
          for f in d.get('files',[]):
              n=f.get('name','')
              if n.lower().endswith('.mp4'):
                  try:s=int(f.get('size') or 0)
                  except:s=0
                  if 3000000 < s < 450000000:c.append((s,n))
          s,n=sorted(c)[0]
          u=f'https://archive.org/download/{ident}/{requests.utils.quote(n)}'
          with requests.get(u,stream=True,timeout=240) as r:
              r.raise_for_status()
              with open('edit-assets/master_hands.mp4','wb') as h:
                  for x in r.iter_content(1024*1024):
                      if x:h.write(x)
          pathlib.Path('edit-assets/master_hands_file.json').write_text(json.dumps({'name':n,'size':s,'url':u},indent=2))
          PY
          urls=(
            'https://cdn.loc.gov/service/pnp/cph/3c30000/3c37000/3c37000/3c37064v.jpg'
            'https://tile.loc.gov/storage-services/service/pnp/fsa/8b15000/8b15400/8b15415v.jpg'
            'https://cdn.loc.gov/service/pnp/ggbain/04500/04508v.jpg'
            'https://cdn.loc.gov/service/pnp/cph/3b20000/3b24000/3b24600/3b24672v.jpg'
            'https://cdn.loc.gov/service/pnp/cph/3c20000/3c22000/3c22400/3c22466v.jpg'
            'https://cdn.loc.gov/service/pnp/cph/3b40000/3b48000/3b48900/3b48999v.jpg'
          )
          i=1; for u in "${urls[@]}"; do curl -L --fail --retry 2 "$u" -o "edit-assets/loc/loc_${i}.jpg" || true; i=$((i+1)); done
          find edit-assets -maxdepth 2 -type f -printf '%P\t%s bytes\n' | sort > edit-assets/FILELIST.txt
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: g0at-edit-assets
          path: edit-assets
          compression-level: 0
          retention-days: 1
